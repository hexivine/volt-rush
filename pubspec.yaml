name: volt_rush
description: "Volt Rush: A fast-paced, score-chasing mobile game."
publish_to: 'none' 
version: 1.0.0+1
environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  vibration: ^1.8.4
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_core: ^4.2.1
  flutter_local_notifications: ^19.5.0
  firebase_messaging: ^16.0.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
