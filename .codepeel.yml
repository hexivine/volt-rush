# CodePeel Configuration
ignore_paths:
  - "build/**"
  - "*.generated.dart"

custom_instructions: |
  This is a Flutter game app. Use structured logging, not console.log.
  All API calls must use HTTPS.

rules:
  - id: no-hardcoded-secrets
    pattern: "(password|secret|api_key|token)\\s*=\\s*['\"][^'\"]{8,}"
    message: "Hardcoded secrets detected. Use environment variables."
    severity: critical
    paths: ["src/**"]

  - id: no-eval
    pattern: "\\beval\\s*\\("
    message: "eval() is forbidden — use JSON.parse() instead."
    severity: critical

  - id: no-http
    pattern: "http://"
    message: "Use HTTPS for all external requests."
    severity: high
    exclude_paths: ["**/*.test.*"]

  - id: no-console
    pattern: "console\\.(log|warn|error)"
    message: "Use AppLogger instead of console methods."
    severity: low
    exclude_paths: ["**/*.test.*"]

  - id: no-empty-catch
    pattern: "catch\\s*\\(\\s*\\)"
    message: "Empty catch blocks hide errors. Handle or log them."
    severity: medium

auto_review:
  enabled: true
  profile: assertive

auto_fix:
  enabled: true
