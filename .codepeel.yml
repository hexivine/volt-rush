# CodePeel Configuration for Volt Rush
ignore_paths:
  - "build/**"
  - "*.generated.dart"

custom_instructions: |
  This is a Flutter mobile game app called Volt Rush.
  We use Provider for state management.
  All Firestore operations should use transactions for writes.
  Prefer const constructors for widgets.

rules:
  - id: firestore-use-transactions
    pattern: "\\.(set|update|delete)\\("
    message: "Firestore writes must use batch or transaction for atomicity."
    severity: high
    paths: ["lib/services/**"]
    exclude_paths: ["**/*.test.*"]

  - id: no-print-in-production
    pattern: "\\bprint\\("
    message: "Use developer.log() instead of print() in production code."
    severity: medium
    paths: ["lib/**"]

  - id: missing-await
    pattern: "^\\s+(?!await\\s)\\w+Service\\(\\)\\."
    message: "Service calls should be awaited to handle errors properly."
    severity: high
    paths: ["lib/**"]

auto_review:
  enabled: true
  profile: assertive

auto_fix:
  enabled: true
