# CodePeel Configuration for volt-rush
# Testing all config options

# Files to exclude from review
ignore_paths:
  - "scripts/**"
  - "*.generated.dart"
  - "build/**"

# Custom instructions for the AI reviewer
custom_instructions: |
  This is a Flutter mobile game app called Volt Rush.
  We use Provider for state management.
  All Firestore operations should use transactions for writes.
  Prefer const constructors for widgets.

# Expert rules — enforced on every review
expert_rules:
  - "Never use print() in production code — use AppLogger instead"
  - "All public methods must have documentation comments"
  - "Firestore writes must use batch or transaction, never raw set/update"

# Custom compliance rules — structured enforcement
rules:
  - id: no-hardcoded-secrets
    pattern: "(password|secret|api_key|token)\\s*=\\s*['\"]"
    message: "Never hardcode secrets. Use environment variables or a secrets manager."
    severity: critical
    paths: ["src/**", "lib/**"]

  - id: no-eval
    pattern: "eval\\("
    message: "eval() is forbidden — it enables code injection attacks."
    severity: critical

  - id: no-http-urls
    pattern: "http://"
    message: "Use HTTPS instead of HTTP for all external requests."
    severity: high
    exclude_paths: ["**/*.test.*", "**/*.spec.*"]

  - id: require-error-handling
    pattern: "catch\\s*\\(\\s*\\)"
    message: "Empty catch blocks swallow errors. Log or handle the error."
    severity: medium

  - id: no-console-log
    pattern: "console\\.log"
    message: "Use structured logging (AppLogger) instead of console.log in production code."
    severity: low
    exclude_paths: ["**/*.test.*", "scripts/**"]

# Review behavior
strictMode: false
securityOnly: false
ignoreFormatting: true

# Walkthrough settings
walkthrough:
  enabled: true
  auto_sequence_diagram: true
  include_affected_files: true
  risk_assessment: true

# Auto-review settings
auto_review:
  enabled: true
  auto_incremental_review: true
  base_branches:
    - master
    - main
  ignore_title_keywords:
    - WIP
    - "DO NOT REVIEW"
  profile: assertive

# Chat
chat:
  auto_reply: true

# Security
security:
  custom_patterns:
    - "VOLT_RUSH_SECRET_[A-Za-z0-9]{16}"

# Auto description
auto_description:
  enabled: true
  postToGithub: false

# Auto test (disabled for now)
auto_test:
  enabled: false

# Auto fix (disabled for now)
auto_fix:
  enabled: true

