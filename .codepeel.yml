# Comprehensive CodePeel Configuration Test
# Tests ALL supported config options

ignore_paths:
  - "build/**"
  - "*.generated.dart"
  - "test/fixtures/**"

custom_instructions: |
  This is a Flutter mobile game app called Volt Rush using Provider for state management.
  All Firestore writes MUST use transactions (see leaderboard_service.dart for the pattern).
  Services should be injected via Provider, never instantiated directly in State classes.
  Use FieldValue.serverTimestamp() for all timestamp fields, never DateTime.now().
  All API calls must have proper error handling with try/catch.

expert_rules:
  - "All async functions must have try/catch error handling"
  - "Never use print() in production code — use a logging service"
  - "State classes must dispose all controllers and subscriptions"
  - "All Firestore queries must have a limit() to prevent unbounded reads"

rules:
  - id: firestore-use-transactions
    pattern: "\\.(set|update|delete|add)\\("
    message: "Firestore writes must use batch or transaction for atomicity."
    severity: high
    paths: ["lib/services/**"]

  - id: no-datetime-now-in-firestore
    pattern: "DateTime\\.now\\(\\)"
    message: "Use FieldValue.serverTimestamp() for Firestore timestamps."
    severity: medium
    paths: ["lib/services/**"]

  - id: no-service-in-state
    pattern: "Service\\(\\)"
    message: "Don't instantiate services directly. Use Provider for dependency injection."
    severity: high
    paths: ["lib/screens/**"]

  - id: no-print-statements
    pattern: "\\bprint\\("
    message: "Remove print() statements — use a proper logging service."
    severity: medium
    paths: ["lib/**"]
    exclude_paths: ["lib/main.dart"]

  - id: no-hardcoded-urls
    pattern: "http(s)?://[^'\"\\s]+"
    message: "Don't hardcode URLs — use environment config or constants file."
    severity: medium
    paths: ["lib/**"]
    exclude_paths: ["lib/firebase_options.dart"]
    category: security

  - id: no-force-unwrap
    pattern: "\\!"
    message: "Avoid force unwrap (!) — use null-safe operators or proper null checks."
    severity: low
    paths: ["lib/**"]
    category: dart

strictMode: false
securityOnly: false
ignoreFormatting: true

walkthrough:
  enabled: true
  auto_sequence_diagram: true
  include_affected_files: true
  risk_assessment: true
  max_length: 5000

auto_review:
  enabled: true
  auto_incremental_review: true
  base_branches: ["master"]
  ignore_title_keywords: ["WIP", "DO NOT REVIEW", "[skip-review]"]
  profile: assertive
  tone_instructions: "Be direct and specific. Focus on bugs and security over style."

chat:
  auto_reply: true

security:
  custom_patterns:
    - "AIza[A-Za-z0-9_\\-]{35}"
    - "sk_live_[A-Za-z0-9]{24,}"

auto_description:
  enabled: true
  postToGithub: false

auto_test:
  enabled: true

auto_fix:
  enabled: true
