# CodePeel Configuration for Volt Rush
ignore_paths:
  - "build/**"
  - "*.generated.dart"

custom_instructions: |
  This is a Flutter mobile game app called Volt Rush using Provider for state management.
  All Firestore writes MUST use transactions (see leaderboard_service.dart for the pattern).
  Services should be injected via Provider, never instantiated directly in State classes.
  Use FieldValue.serverTimestamp() for all timestamp fields, never DateTime.now().

rules:
  - id: firestore-use-transactions
    pattern: "\\.(set|update|delete|add)\\("
    message: "Firestore writes must use batch or transaction for atomicity."
    severity: high
    paths: ["lib/services/**"]

  - id: no-datetime-now-in-firestore
    pattern: "DateTime\\.now\\(\\)"
    message: "Use FieldValue.serverTimestamp() for Firestore timestamps."
    severity: medium
    paths: ["lib/services/**"]

  - id: no-service-in-state
    pattern: "Service\\(\\)"
    message: "Don't instantiate services directly. Use Provider for dependency injection."
    severity: high
    paths: ["lib/screens/**"]

auto_review:
  enabled: true
  profile: assertive

auto_fix:
  enabled: true
